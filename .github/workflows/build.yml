name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.10.1'
  QSCI_VERSION: '2.14.1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-22.04          # older glibc = AppImage runs on more distros
            qt_arch: linux_gcc_64
            qt_tools: ''
          - name: macOS-Universal     # Intel + Apple Silicon in one app
            os: macos-latest
            qt_arch: clang_64
            qt_tools: ''
          - name: Windows-x64
            os: windows-latest
            qt_arch: win64_mingw
            qt_tools: tools_mingw1310
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build and packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1 libfuse2 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtwebsockets
          tools: ${{ matrix.qt_tools }}
          cache: true

      - name: Use Qt's MinGW compiler (Windows)
        if: runner.os == 'Windows'
        run: echo "$IQTA_TOOLS/mingw1310_64/bin" >> "$GITHUB_PATH"

      # ---- QScintilla: official Riverbank steps (qmake, make, make install) ----
      - name: Download QScintilla source
        run: |
          curl -fsSL -o qsci.tar.gz "https://www.riverbankcomputing.com/static/Downloads/QScintilla/${QSCI_VERSION}/QScintilla_src-${QSCI_VERSION}.tar.gz"
          tar -xzf qsci.tar.gz

      - name: Build and install QScintilla (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: QScintilla_src-${{ env.QSCI_VERSION }}/src
        run: |
          qmake qscintilla.pro CONFIG+=staticlib CONFIG+=release ${{ runner.os == 'macOS' && '"QMAKE_APPLE_DEVICE_ARCHS=x86_64 arm64"' || '' }}
          make -j4
          make install

      - name: Build and install QScintilla (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: QScintilla_src-${{ env.QSCI_VERSION }}/src
        run: |
          qmake qscintilla.pro CONFIG+=staticlib CONFIG+=release CONFIG-=debug_and_release
          mingw32-make -j4
          mingw32-make install

      # ---- NoteFlow ----
      - name: Configure
        run: >
          cmake -S src/ui -B build
          ${{ runner.os == 'Windows' && '-G "MinGW Makefiles"' || '' }}
          ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12' || '' }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          cat > noteflow.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NoteFlow
          Comment=Collaboratively review and annotate files in real time
          Exec=NoteFlow
          Icon=noteflow
          Categories=Office;Development;
          EOF

          cat > noteflow.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#2f6fde"/>
            <path d="M72 184V72l112 112V72" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF

          EXE="$(find build -maxdepth 2 -type f -name NoteFlow -perm -u+x | head -1)"
          export QMAKE="$(command -v qmake)"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable "$EXE" \
            --desktop-file noteflow.desktop \
            --icon-file noteflow.svg \
            --plugin qt --output appimage
          mv NoteFlow*.AppImage "NoteFlow-${{ matrix.name }}.AppImage"

      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="$(find build -maxdepth 2 -type d -name 'NoteFlow.app' | head -1)"
          macdeployqt "$APP"
          codesign --force --deep --sign - "$APP"   # ad-hoc sign so Apple Silicon will launch it
          ditto -c -k --keepParent "$APP" "NoteFlow-${{ matrix.name }}.zip"

      - name: Package folder (Windows)
        if: runner.os == 'Windows'
        run: |
          EXE="$(find build -maxdepth 2 -type f -name NoteFlow.exe | head -1)"
          mkdir -p dist/NoteFlow
          cp "$EXE" dist/NoteFlow/
          windeployqt --release --compiler-runtime dist/NoteFlow/NoteFlow.exe
          7z a "NoteFlow-${{ matrix.name }}.zip" ./dist/NoteFlow

      - uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-${{ matrix.name }}
          path: NoteFlow-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
